<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corrosion 3D — de l'interface aux molécules</title>
<style>
:root{--bg:#0a0e13;--fg:#e6edf3;--mut:#9aa7b4;--card:rgba(16,22,30,.88);--acc:#ff7a1a;--bd:rgba(255,255,255,.14)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#top{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px)}
#modes{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:7px 11px;cursor:pointer;white-space:nowrap}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.panel{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);max-width:620px;margin:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:9px 10px}
#cap{font-size:12.5px}#eq{margin:5px 0;font:11.5px ui-monospace,Menlo,monospace;color:#cfe0f0}
#st{color:var(--mut);font-size:12px;margin-top:4px}
.row{display:flex;gap:6px;align-items:center;margin-top:6px}.row label{flex:0 0 78px;font-size:12px;color:var(--mut)}.row input{flex:1;min-width:0}
#lg{display:flex;flex-wrap:wrap;gap:3px 9px;margin-top:6px;font-size:11px}
#lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;border:1px solid #fff4}
#tg{padding:2px 8px;float:right;font-size:11px}
</style></head><body>
<canvas id="c"></canvas>
<div id="top"><div id="modes"></div></div>
<div class="panel"><button id="tg">▾</button><div id="cap"></div>
<div id="det"><div id="eq"></div>
<div class="row"><label id="pl">Température</label><input id="par" type="range" min="0" max="100" value="50"></div>
<div class="row"><label>Vitesse</label><input id="spd" type="range" min="20" max="300" value="100"><button id="pp">⏸</button><button id="rs">↺</button><button id="cp" hidden>Couplage : ON</button></div>
<div id="st"></div><div id="lg"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),V=(x,y,z)=>new THREE.Vector3(x,y,z),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=Math.random;
const SP=.5,NX=24,NZ=8,NY=5,N=NX*NZ*NY,MAXP=720,PL0=.8,PL1=1;
const SPEC=[{c:0x5aa9ff,r:.12,m:1},{c:0x39d353,r:.19,m:.8},{c:0xb388ff,r:.15,m:.7},{c:0xff5252,r:.17,m:.9},{c:0xffa726,r:.17,m:.6},{c:0x00e5ff,r:.13,m:.9},{c:0xffffff,r:.1,m:1.2},{c:0x8d3b1f,r:.2,m:.12}];
const NAMES=['Uniforme','Galvanique','Piqûres','Caverneuse','CSC'];
const EQ=[['Anode : Fe → Fe²⁺ + 2 e⁻','Cathode : O₂ + 2 H₂O + 4 e⁻ → 4 OH⁻','Fe²⁺ + 2 OH⁻ → Fe(OH)₂ → rouille'],
['Anode (Zn) : Zn → Zn²⁺ + 2 e⁻','Cathode (Cu) : O₂ + 2 H₂O + 4 e⁻ → 4 OH⁻','Zn (E° = −0,76 V) se sacrifie, Cu (+0,34 V) est protégé'],
['Dans la piqûre : Fe → Fe²⁺ + 2 e⁻','Hydrolyse : Fe²⁺ + 2 H₂O → Fe(OH)₂ + 2 H⁺','Cl⁻ migre vers la piqûre : acidification, autocatalyse'],
['Crevasse (peu d’O₂) : Fe → Fe²⁺ + 2 e⁻','Extérieur : O₂ + 2 H₂O + 4 e⁻ → 4 OH⁻','Aération différentielle + migration de Cl⁻ + H⁺'],
['Pointe de fissure : Fe → Fe²⁺ + 2 e⁻','Parois : O₂ + 2 H₂O + 4 e⁻ → 4 OH⁻','Traction : le film se rompt, la fissure avance']];
const CAP=['Corrosion uniforme : anodes et cathodes microscopiques se déplacent sur toute la surface, qui s’amincit régulièrement.',
'Corrosion galvanique : deux métaux couplés dans l’électrolyte. Les électrons vont du zinc (gauche) vers le cuivre (droite), où O₂ est réduit.',
'Piqûres : un film passif protège le métal ; les Cl⁻ le percent localement. Dans la piqûre, l’acidité et les Cl⁻ s’accumulent et accélèrent l’attaque.',
'Crevasse : sous la plaque, O₂ se raréfie. Cette zone devient anodique, l’extérieur (riche en O₂) cathodique ; Cl⁻ entre et l’acidité monte.',
'CSC : sous contrainte de traction, la pointe de la fissure se dissout et le film s’y rompt : la fissure s’approfondit jusqu’à la rupture.'];
const PL=['Température','Température','[Cl⁻]','[Cl⁻]','Contrainte σ'];
[['#9aa4b0','Fe'],['#a9c1d6','Zn'],['#d2793b','Cu'],['#5aa9ff','H₂O'],['#39d353','Cl⁻'],['#b388ff','Na⁺'],['#ff5252','O₂'],['#ffa726','Fe²⁺'],['#00e5ff','OH⁻'],['#fff','H⁺'],['#8d3b1f','rouille'],['#ffee58','e⁻']].forEach(([c,t])=>$('lg').insertAdjacentHTML('beforeend',`<span><i style="background:${c}"></i>${t}</span>`));
NAMES.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>reset(i);$('modes').appendChild(b)});

/* ===== Scène ===== */
const cv=$('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene();S.background=new THREE.Color(0x0a0e13);
const cam=new THREE.PerspectiveCamera(50,1,.1,200);
S.add(new THREE.AmbientLight(0xffffff,.75));const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(5,10,8);S.add(dl);
const mat=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.45,metalness:.3},o||{}));
const sg=new THREE.SphereGeometry(1,12,8),D=new THREE.Object3D(),col=new THREE.Color();
const am=new THREE.InstancedMesh(sg,mat(0xffffff,{metalness:.5}),N);S.add(am);
const fm=new THREE.InstancedMesh(sg,new THREE.MeshStandardMaterial({color:0xcfe3ff,transparent:true,opacity:.7,roughness:.3}),NX*NZ);S.add(fm);
const pm=new THREE.InstancedMesh(sg,new THREE.MeshStandardMaterial({roughness:.4,metalness:.1}),MAXP);S.add(pm);pm.setColorAt(0,col);
const em=new THREE.InstancedMesh(sg,new THREE.MeshBasicMaterial({color:0xffee58,depthTest:false,transparent:true}),80);em.renderOrder=9;S.add(em);
const edge=(w,h,d,y,c)=>{const e=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w,h,d)),new THREE.LineBasicMaterial({color:c}));e.position.y=y;S.add(e)};
edge(12.4,4.5,4.2,2.25,0x3a78b5);edge(12.4,2.5,4.2,-1.25,0x667788);
S.add(new THREE.Mesh(new THREE.BoxGeometry(12.4,4.5,4.2),new THREE.MeshBasicMaterial({color:0x2f8cff,transparent:true,opacity:.05,depthWrite:false})).translateY(2.25));
const plate=new THREE.Mesh(new THREE.BoxGeometry(7.2,PL1-PL0,4.2),new THREE.MeshStandardMaterial({color:0xb0b8c0,transparent:true,opacity:.55}));plate.position.set(2.6,(PL0+PL1)/2,0);S.add(plate);
const wire=new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(-3,-2.5,0),V(-3,-3.5,0),V(3,-3.5,0),V(3,-2.5,0)]),new THREE.LineBasicMaterial({color:0xd2793b}));S.add(wire);
const arr=[-1,1].map(s=>{const a=new THREE.ArrowHelper(V(s,0,0),V(s*6.3,-1.25,0),1.5,0xff6b6b,.5,.35);S.add(a);return a});

/* ===== État ===== */
let MODE=0,par=.5,spd=1,play=true,coupled=true,T=0,fr=0,P=[],dissolved=0,acc=0,N0=N,cd=0,maxD=0,dep=0,nIn=0,AC=null,CC=null,broken=false;
const pres=new Uint8Array(N),film=new Uint8Array(NX*NZ),pit=new Set(),E=[],PEND=[];
const xo=ix=>MODE===4?(ix<12?-1:1)*par*(.12+.07*cd):0;
const tpAt=(ix,iz)=>{for(let iy=NY-1;iy>=0;iy--)if(pres[(ix*NZ+iz)*NY+iy])return iy;return -1};
const cix=x=>clamp(Math.round(x/SP+11.5),0,NX-1),ciz=z=>clamp(Math.round(z/SP+3.5),0,NZ-1),colOf=(x,z)=>cix(x)*NZ+ciz(z);
const floorY=(x,z)=>{const t=tpAt(cix(x),ciz(z));return t<0?-NY*SP:-.25-(NY-1-t)*SP+.22};
function setAtom(i){const iy=i%NY,iz=((i/NY)|0)%NZ,ix=(i/(NZ*NY))|0;D.position.set((ix-11.5)*SP+xo(ix),-.25-(NY-1-iy)*SP,(iz-3.5)*SP);D.scale.setScalar(pres[i]?.22:.0001);D.updateMatrix();am.setMatrixAt(i,D.matrix)}
function setFilm(c){D.position.set(((c/NZ|0)-11.5)*SP,.12,(c%NZ-3.5)*SP);D.scale.setScalar(film[c]?.22:.0001);D.updateMatrix();fm.setMatrixAt(c,D.matrix);fm.instanceMatrix.needsUpdate=true}
function spawn(s,x,y,z,c){if(P.length>=MAXP){const k=P.findIndex(p=>p.s===7);if(k<0)return null;P.splice(k,1)}const p={s,x,y,z,vx:0,vy:0,vz:0,c:c===undefined?SPEC[s].c:c,tg:0};P.push(p);return p}
const nCl=()=>MODE===2||MODE===3?Math.round(8+par*45):26;
function rp(s){const x=(rnd()-.5)*11.6,z=(rnd()-.5)*3.8,tp=(MODE===3&&x>-1)?.65:4.3,f=floorY(x,z)+.2;return spawn(s,x,f+rnd()*(tp-f),z)}
function reset(m){MODE=m;pres.fill(1);film.fill(1);pit.clear();P=[];E.length=0;PEND.length=0;dissolved=0;cd=0;maxD=0;acc=0;broken=false;
 if(m===4)for(let iz=0;iz<NZ;iz++)for(const ix of [11,12])for(const iy of [3,4])pres[(ix*NZ+iz)*NY+iy]=0;
 N0=0;for(let i=0;i<N;i++)N0+=pres[i];
 for(let i=0;i<N;i++){const ix=(i/(NZ*NY))|0;col.setHex(m===1?(ix<12?0xa9c1d6:0xd2793b):0x9aa4b0);am.setColorAt(i,col);setAtom(i)}
 am.instanceMatrix.needsUpdate=am.instanceColor.needsUpdate=true;for(let c=0;c<NX*NZ;c++)setFilm(c);
 plate.visible=m===3;fm.visible=m===2;wire.visible=m===1&&coupled;arr.forEach(a=>a.visible=m===4);
 for(let i=0;i<150;i++)rp(0);for(let i=0;i<nCl();i++){rp(1);rp(2)}for(let i=0;i<26;i++)rp(3);
 [...$('modes').children].forEach((b,i)=>b.classList.toggle('on',i===m));
 $('cap').textContent=CAP[m];$('eq').innerHTML=EQ[m].join('<br>');$('pl').textContent=PL[m];$('cp').hidden=m!==1}
$('par').oninput=e=>par=e.target.value/100;$('spd').oninput=e=>spd=e.target.value/100;
$('pp').onclick=()=>{play=!play;$('pp').textContent=play?'⏸':'▶'};$('rs').onclick=()=>reset(MODE);
$('cp').onclick=()=>{coupled=!coupled;$('cp').textContent='Couplage : '+(coupled?'ON':'OFF');wire.visible=MODE===1&&coupled};
$('tg').onclick=()=>{const d=$('det');d.hidden=!d.hidden;$('tg').textContent=d.hidden?'▴':'▾'};

/* ===== Réactions ===== */
function pick(){for(let k=0;k<20;k++){let ix,iz=rnd()*NZ|0;
 if(MODE===1)ix=rnd()*12|0;else if(MODE===4)ix=11+(rnd()*2|0);
 else if(MODE===2){if(!pit.size)return -1;const a=[...pit],c=a[rnd()*a.length|0];ix=(c/NZ)|0;iz=c%NZ}
 else if(MODE===3){const w=3*(1+3*dep);ix=rnd()<w/(w+.25)?10+(rnd()*14|0):rnd()*10|0}else ix=rnd()*NX|0;
 const t=tpAt(ix,iz);if(t<0)continue;const i=(ix*NZ+iz)*NY+t;if(PEND.some(p=>p.i===i))continue;return i}return -1}
const rate=()=>{const f=.4+1.2*par;return[6*f,9*f*(coupled?1:.3),pit.size?(2+1.5*Math.min(pit.size,8))*(.5+par):0,3*(1+3*dep)*(.5+par),1.5+10*par][MODE]};
const okC=(x,z)=>MODE===1?(coupled?x>0:true):MODE===2?!pit.has(colOf(x,z)):MODE===4?Math.abs(x)>1.5:true;
function cath(){for(let k=0;k<25;k++){const p=P[rnd()*P.length|0];if(p&&p.s===3&&!p.tg&&p.y<2&&okC(p.x,p.z))return p}return null}
function finish(i){const iy=i%NY,iz=((i/NY)|0)%NZ,ix=(i/(NZ*NY))|0;pres[i]=0;setAtom(i);am.instanceMatrix.needsUpdate=true;dissolved++;
 const x=(ix-11.5)*SP+xo(ix),y=-.25-(NY-1-iy)*SP,z=(iz-3.5)*SP,zn=MODE===1&&ix<12;
 const io=spawn(4,x,y+.35,z,zn?0xcfd8dc:0xffa726);if(io)io.vy=.8;
 if(MODE>=2&&rnd()<.8)spawn(6,x,y+.4,z);
 for(let k=0;k<2;k++){const tp=cath();let tx=tp?tp.x:(rnd()-.5)*10,tz=tp?tp.z:(rnd()-.5)*3;if(!tp&&!okC(tx,tz))tx=MODE===1?3:MODE===4?4:-4;
  E.push({x0:x,y0:y,z0:z,x1:tx,y1:floorY(tx,tz),z1:tz,t:0,d:Math.max(.3,Math.hypot(tx-x,tz-z)/5),p:tp,dip:MODE===1&&coupled?1.2:.4});if(tp)tp.tg=1}
 if(MODE===2&&iy<NY-2&&rnd()<.2){const nc=clamp(ix+(rnd()<.5?-1:1),0,NX-1)*NZ+iz;if(film[nc]){film[nc]=0;pit.add(nc);setFilm(nc)}}}
function step(p,dt){const sp=SPEC[p.s],A=40*sp.m*dt,px=p.x,py=p.y;
 p.vx+=(rnd()-.5)*A;p.vy+=(rnd()-.5)*A;p.vz+=(rnd()-.5)*A;if(p.s===7)p.vy-=1.5*dt;
 const t=p.s===1?AC:p.s===2?CC:null;
 if(t){const dx=t.x-p.x,dy=t.y-p.y,dz=t.z-p.z,d=Math.hypot(dx,dy,dz)+.01;if(d>.4){const k=2.5*dt/d;p.vx+=dx*k;p.vy+=dy*k;p.vz+=dz*k}}
 const k=Math.exp(-(p.s===7?8:3)*dt);p.vx*=k;p.vy*=k;p.vz*=k;
 p.x=clamp(p.x+p.vx*dt,-6,6);p.y+=p.vy*dt;p.z=clamp(p.z+p.vz*dt,-1.9,1.9);
 if(p.x===6||p.x===-6)p.vx*=-1;if(Math.abs(p.z)===1.9)p.vz*=-1;
 const r=sp.r,f=floorY(p.x,p.z)+r;if(p.y<f){p.y=f;p.vy=Math.abs(p.vy)*.5}if(p.y>4.4){p.y=4.4;p.vy=-Math.abs(p.vy)}
 if(MODE===3&&p.x>-1&&p.y>PL0-r&&p.y<PL1+r){if(py<(PL0+PL1)/2){p.y=PL0-r;p.vy=-Math.abs(p.vy)}else{p.y=PL1+r;p.vy=Math.abs(p.vy)}}
 if(MODE===2&&p.s===1&&p.y<.5){const c=colOf(p.x,p.z);if(film[c]&&rnd()<dt*(.3+2.5*par)){film[c]=0;pit.add(c);setFilm(c)}}}

/* ===== Caméra ===== */
const C={th:.25,ph:1.15,r:14};let busy=0;const ptr=new Map(),dist=()=>{const o=[...ptr.values()];return Math.hypot(o[0][0]-o[1][0],o[0][1]-o[1][1])||1};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY])});
cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;
 if(ptr.size===1){C.th-=(e.clientX-p[0])*.006;C.ph=clamp(C.ph-(e.clientY-p[1])*.006,.15,1.75)}
 const old=ptr.size===2?dist():0;ptr.set(e.pointerId,[e.clientX,e.clientY]);if(ptr.size===2)C.r=clamp(C.r*old/dist(),7,26)});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,e=>ptr.delete(e.pointerId)));
cv.addEventListener('wheel',e=>{e.preventDefault();C.r=clamp(C.r*(1+Math.sign(e.deltaY)*.1),7,26)},{passive:false});
function rs(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?75:50;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();reset(0);

/* ===== Boucle ===== */
let last=performance.now();
function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-last)/1000);last=now;
 if(play){dt*=spd;T+=dt;fr++;
  acc+=rate()*dt;while(acc>1){acc--;const i=pick();if(i>=0){col.setHex(0xff7a00);am.setColorAt(i,col);am.instanceColor.needsUpdate=true;PEND.push({i,t:.35})}}
  for(let k=PEND.length-1;k>=0;k--){PEND[k].t-=dt;if(PEND[k].t<=0){finish(PEND[k].i);PEND.splice(k,1)}}
  if(fr%10===0){nIn=0;P.forEach(p=>{if(p.s===3&&p.x>-1&&p.y<PL0)nIn++});dep=1-clamp(nIn/5,0,1);
   maxD=0;for(let c=0;c<NX*NZ;c++)maxD=Math.max(maxD,NY-1-tpAt((c/NZ)|0,c%NZ));if(MODE===4){cd=Math.max(0,maxD-2);broken=maxD>=NY;for(let i=0;i<N;i++)setAtom(i);am.instanceMatrix.needsUpdate=true}
   let a=null,b=null;
   if(MODE===1){a=V(-3,.4,0);b=V(3,.5,0)}else if(MODE===2&&pit.size){let sx=0,sz=0;pit.forEach(c=>{sx+=((c/NZ|0)-11.5)*SP;sz+=(c%NZ-3.5)*SP});a=V(sx/pit.size,-.2,sz/pit.size)}
   else if(MODE===3){a=V(3,.3,0);b=V(-3,.6,0)}else if(MODE===4)a=V(0,-.3-cd*.5,0);AC=a;CC=b;
   const c=[0,0,0];P.forEach(p=>{if(p.s===1)c[0]++;else if(p.s===2)c[1]++;else if(p.s===3)c[2]++});
   const tc=nCl();if(c[0]<tc){const q=spawn(1,(rnd()-.5)*11,4.2,(rnd()-.5)*3.6);if(q);spawn(2,(rnd()-.5)*11,4.2,(rnd()-.5)*3.6)}else if(c[0]>tc){const k1=P.findIndex(p=>p.s===1),k2=P.findIndex(p=>p.s===2);if(k1>=0)P[k1].dead=1;if(k2>=0)P[k2].dead=1}
   if(c[2]<26)spawn(3,(rnd()-.5)*11,4.2,(rnd()-.5)*3.6)}
  P.forEach(p=>step(p,dt));
  const ions=P.filter(p=>p.s===4),oh=P.filter(p=>p.s===5),hh=P.filter(p=>p.s===6);
  for(const a of ions)for(const b of oh)if(!a.dead&&!b.dead&&(a.x-b.x)**2+(a.y-b.y)**2+(a.z-b.z)**2<.25){a.dead=b.dead=1;spawn(7,a.x,a.y,a.z,a.c===0xffa726?0x8d3b1f:0xe8e8e8);break}
  for(const a of hh)for(const b of oh)if(!a.dead&&!b.dead&&(a.x-b.x)**2+(a.y-b.y)**2+(a.z-b.z)**2<.25){a.dead=b.dead=1;spawn(0,a.x,a.y,a.z);break}
  P=P.filter(p=>!p.dead);
  for(let i=E.length-1;i>=0;i--){const e=E[i];e.t+=dt/e.d;if(e.t>=1){const q=e.p;if(q&&q.s===3&&!q.dead){q.s=5;q.c=SPEC[5].c;q.tg=0}else spawn(5,e.x1,e.y1+.15,e.z1);E.splice(i,1)}}
  $('st').textContent=`Atomes dissous : ${dissolved} (${f1(dissolved/N0*100)} %) · profondeur max : ${maxD} couche(s)`+(MODE===3?` · O₂ sous la plaque : ${nIn}`:MODE===2?` · piqûres actives : ${pit.size} col.`:MODE===4?(broken?' · RUPTURE !':` · fissure : ${cd+2}/${NY}`):'')}
 pm.count=P.length;P.forEach((p,i)=>{D.position.set(p.x,p.y,p.z);D.scale.setScalar(SPEC[p.s].r);D.updateMatrix();pm.setMatrixAt(i,D.matrix);col.setHex(p.c);pm.setColorAt(i,col)});
 pm.instanceMatrix.needsUpdate=pm.instanceColor.needsUpdate=true;
 em.count=Math.min(E.length,80);for(let i=0;i<em.count;i++){const e=E[i],t=e.t;D.position.set(e.x0+(e.x1-e.x0)*t,e.y0+(e.y1-e.y0)*t-e.dip*Math.sin(Math.PI*t),e.z0+(e.z1-e.z0)*t);D.scale.setScalar(.09);D.updateMatrix();em.setMatrixAt(i,D.matrix)}em.instanceMatrix.needsUpdate=true;
 if(MODE===4)arr.forEach(a=>a.setLength(.3+2.2*par+.2*Math.sin(T*6),.5,.35));
 cam.position.set(C.r*Math.sin(C.ph)*Math.sin(C.th),.6+C.r*Math.cos(C.ph),C.r*Math.sin(C.ph)*Math.cos(C.th));cam.lookAt(0,.4,0);R.render(S,cam)}
const f1=x=>x.toFixed(1).replace('.',',');
requestAnimationFrame(loop);
</script></body></html>
