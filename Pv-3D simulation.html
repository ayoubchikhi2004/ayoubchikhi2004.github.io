<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolarCraft 3D: Energy Architect</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8fafc;color:#1e293b;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:980px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#0f172a;color:#fff;padding:8px 12px}
header b{font-size:17px;margin-right:auto}header span{font-size:13px;color:#cbd5e1}
#view{width:100%;height:44vh;min-height:280px;max-height:520px;background:#9fc9ee;touch-action:none;position:relative}
#view canvas{display:block;width:100%;height:100%}
#tip{position:absolute;left:8px;bottom:6px;font-size:11px;color:#0f172a;background:#ffffffb0;padding:2px 6px;border-radius:4px}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;background:#e2e8f0}
button{font:inherit;border:1.5px solid #0f172a;background:#fff;color:#0f172a;border-radius:8px;padding:8px 10px;min-height:42px;cursor:pointer}
button[aria-pressed=true],nav button.on{background:#0f172a;color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
button small{display:block;font-size:11px;opacity:.75;line-height:1.3}
button:focus-visible,input:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
#pn{padding:10px 12px 40px}
h3{margin:14px 0 6px;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.row>button{flex:1 1 140px}
.k{background:#fff;border:1.5px solid #cbd5e1;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px}
.ok{color:#15803d}.bad{color:#b91c1c}.warn{color:#b45309}
label{display:block;margin:8px 0;font-size:14px}label input{width:100%}
.go{background:#f59e0b;border-color:#0f172a;font-weight:700;width:100%;margin-top:10px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.stat div{background:#fff;border:1.5px solid #cbd5e1;border-radius:8px;padding:6px;text-align:center}
.stat b{display:block;font-size:17px}.stat small{color:#64748b}
canvas#ch{width:100%;height:auto;background:#fff;border:1.5px solid #cbd5e1;border-radius:8px}
.edu{background:#eff6ff;border:1.5px solid #93c5fd;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13.5px}
#menu{position:fixed;inset:0;background:#0f172ae6;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9;overflow:auto}
#menu .card{background:#fff;border-radius:12px;padding:16px;max-width:460px;width:100%}
#menu h1{margin:0}#menu p{margin:0 0 6px;color:#64748b}
.cl{display:block;width:100%;text-align:left;margin:6px 0}
</style>
</head>
<body>
<div id="app">
<header><b>☀ SolarCraft 3D</b><span id="hC"></span><span id="hB"></span><button id="bM">Menu</button></header>
<div id="view"><div id="tip">Drag to orbit · scroll or pinch to zoom</div></div>
<nav id="nv"></nav>
<main id="pn"></main>
</div>
<div id="menu"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),D=Math.PI/180,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const PN=[{n:'Monocrystalline 400 W',P:400,Voc:41,Vmp:34,Isc:12.2,g:-.0035,pr:180,c:'#10233f'},{n:'Polycrystalline 330 W',P:330,Voc:46,Vmp:37,Isc:9.3,g:-.004,pr:125,c:'#2a5fa8'},{n:'Flexible 200 W',P:200,Voc:24,Vmp:20,Isc:10.4,g:-.0025,pr:140,c:'#3a3f4c'}];
const IVS=[{n:'String 5 kW',kw:5,vmax:600,vmin:120,e:.97,pr:900,t:'s'},{n:'String 10 kW',kw:10,vmax:1000,vmin:180,e:.97,pr:1700,t:'s'},{n:'Microinverters (per panel)',kw:0,e:.96,pr:95,t:'m'},{n:'Hybrid 5 kW',kw:5,vmax:500,vmin:100,e:.96,pr:1800,t:'h'},{n:'Hybrid 10 kW',kw:10,vmax:600,vmin:150,e:.96,pr:3000,t:'h'}];
const BTS=[{n:'None'},{n:'Li-ion 5 kWh',cap:5,dod:.9,e:.96,pr:2500},{n:'Lead-acid 5 kWh',cap:5,dod:.5,e:.8,pr:1200}];
const ITM={fuse:['DC fuses',60],breaker:['Breakers',90],spd:['Surge protector (SPD)',120],ground:['Grounding kit',70],clean:['Auto-cleaning system',300]};
const PROF={res:[.35,.3,.3,.3,.3,.4,.7,1,.8,.6,.5,.5,.6,.5,.5,.6,.8,1.2,1.6,1.7,1.5,1.2,.8,.5],ind:[.2,.2,.2,.2,.2,.3,.6,1,1.2,1.3,1.3,1.2,1.1,1.3,1.3,1.2,1,.7,.4,.3,.2,.2,.2,.2],farm:[.2,.2,.2,.2,.2,.3,.5,.8,1.2,1.6,1.8,1.8,1.7,1.6,1.4,.9,.6,.5,.6,.6,.5,.4,.3,.2],hosp:[.8,.8,.8,.8,.8,.85,.9,1,1.1,1.15,1.2,1.2,1.2,1.2,1.15,1.1,1.05,1,1,.95,.9,.85,.85,.8]};
const ST=[
{n:'Family house',em:'🏠',lat:34,dec:0,ground:'#6b9b4d',b:[0,0,9,3,7],m:{w:9,d:7,y:3},ob:[['t',-8,3,6.5],['t',-7,-3,5.5],['t',9,5,5]],dem:14,pr:'res',bud:7500,grid:1,pay:1800,ta:26,soil:.004,req:['breaker','ground'],out:0,r:26,info:'Flat-roof home, grid-tied. Trees to the west will shade the afternoon.'},
{n:'Desert farm',em:'🏜️',lat:30,dec:23.4,ground:'#d9c08a',b:[-14,0,4,3,4],m:{w:16,d:9,y:.3},ob:[['b',9,-10,2,8,2],['b',-6,10,3,3,3]],dem:30,pr:'farm',bud:15000,grid:0,pay:3500,ta:38,soil:.05,req:['spd','ground','breaker'],out:0,r:36,info:'Off-grid irrigation farm. Heat and dust are severe. It needs batteries and a hybrid inverter.'},
{n:'Factory',em:'🏭',lat:36,dec:23.4,ground:'#8d949c',b:[0,0,24,8,14],m:{w:20,d:12,y:8},ob:[['b',-16,4,2,14,2],['b',17,-6,4,12,4]],dem:70,pr:'ind',bud:28000,grid:1,pay:5000,ta:32,soil:.01,req:['fuse','breaker','ground'],out:0,r:52,info:'Large flat roof, daytime load. Chimneys create moving shadows.'},
{n:'Hospital',em:'🏥',lat:33,dec:-15,ground:'#7aa06a',b:[0,0,26,10,12],m:{w:22,d:10,y:10},ob:[['b',-19,0,8,16,12],['t',12,12,8]],dem:90,pr:'hosp',bud:38000,grid:1,pay:7000,ta:22,soil:.006,req:['fuse','breaker','spd','ground'],out:[17,21],r:56,info:'Critical load. A grid outage hits on day 2 from 17:00 to 21:00. You need battery backup and every safety item.'}];
const EV={clear:['Clear sky',{cloud:1,dT:0,soil:0}],cloud:['Cloudy',{cloud:.45,dT:-3,soil:0}],heat:['Heat wave',{cloud:1,dT:12,soil:0}],dust:['Dust storm',{cloud:.85,dT:2,soil:.12}],storm:['Thunderstorm',{cloud:.3,dT:-4,soil:0,st:14}]};
let G={mode:'career',site:0,ph:0,stars:[],bank:0,cfg:null,v:null,sim:null};
let sc,cam,ren,sunL,sunM,world,arr,pth,obs=[],panels=[],cm={a:.6,e:.5,r:30};
const ray=new THREE.Raycaster(),QQ=new THREE.Quaternion();

/* ---------- physics helpers ---------- */
function sunPos(lat,dec,t){const H=15*(t-12)*D,l=lat*D,d=dec*D,se=Math.sin(l)*Math.sin(d)+Math.cos(l)*Math.cos(d)*Math.cos(H),el=Math.asin(cl(se,-1,1));let ca=(Math.sin(d)-se*Math.sin(l))/(Math.cos(el)*Math.cos(l)+1e-9);let az=Math.acos(cl(ca,-1,1))/D;if(H>0)az=360-az;return{el:el/D,az}}
function sdir(s){const e=s.el*D,a=s.az*D;return new THREE.Vector3(Math.sin(a)*Math.cos(e),Math.sin(e),-Math.cos(a)*Math.cos(e))}
function layout(tilt){const S=ST[G.site],b=tilt*D,pitch=1.7*Math.cos(b)+1.7*Math.sin(b)*1.2+.15,cols=Math.max(1,Math.floor(S.m.w/1.05)),rows=Math.max(1,1+Math.floor((S.m.d-1.7*Math.cos(b))/pitch));return{cols,rows,pitch,cap:cols*rows}}
function design(){
 const c=G.cfg,P=PN[c.panel],I=IVS[c.inv],S=ST[G.site],micro=I.t=='m',s=micro?1:c.S,n=c.n,str=Math.ceil(n/s),par=Math.max(1,Math.floor(n/s));
 const Voc=s*P.Voc*(1+.003*(25-(S.ta-12))),Vmp=s*P.Vmp*(1-.0035*(S.ta+30-25)),m=[];let st='ok';
 if(!micro){if(Voc>I.vmax){st='over';m.push(['bad',`Cold-morning string voltage ${Math.round(Voc)} V exceeds the inverter limit (${I.vmax} V). Use fewer panels in series.`])}
  else if(Vmp<I.vmin){st='under';m.push(['bad',`Hot-day string voltage ${Math.round(Vmp)} V is below the inverter MPPT minimum (${I.vmin} V). Add panels in series.`])}
  else m.push(['ok',`String voltage window OK: ${Math.round(Vmp)} V hot to ${Math.round(Voc)} V cold.`]);
  if(n%s)m.push(['warn','Strings have unequal lengths: about 7% mismatch loss.']);
  if(n*P.P/1000>I.kw*1.4)m.push(['warn',`Array ${(n*P.P/1000).toFixed(1)} kWp is much larger than the ${I.kw} kW inverter: midday clipping.`])}
 if(c.bq>0&&I.t!='h')m.push(['warn','Batteries only work with a hybrid inverter.']);
 if(!S.grid&&!(I.t=='h'&&c.bq>0&&c.bt))m.push(['bad','Off-grid site: you need a hybrid inverter and batteries for the nights.']);
 return{s,str,par,Voc,Vmp,st,m,I:P.Isc*par,Pdc:n*P.P}
}
function cost(){const c=G.cfg,P=PN[c.panel],I=IVS[c.inv];let t=c.n*(P.pr+40)+(I.t=='m'?c.n*I.pr:I.pr);if(c.bt)t+=c.bq*BTS[c.bt].pr;for(const k in c.items)if(c.items[k])t+=ITM[k][1];return t}

/* ---------- 3D ---------- */
function mesh(g,c,cast=true){const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:c,roughness:.85}));m.castShadow=cast;m.receiveShadow=true;return m}
function initGL(){
 sc=new THREE.Scene();cam=new THREE.PerspectiveCamera(50,1,.1,500);
 ren=new THREE.WebGLRenderer({antialias:true});ren.shadowMap.enabled=true;$('view').prepend(ren.domElement);
 sc.add(new THREE.HemisphereLight(0xffffff,0x667755,.6));
 sunL=new THREE.DirectionalLight(0xfff2d6,.9);sunL.castShadow=true;const s=sunL.shadow.camera;s.left=-45;s.right=45;s.top=45;s.bottom=-45;s.far=200;sunL.shadow.mapSize.set(2048,2048);sc.add(sunL);sc.add(sunL.target);
 sunM=new THREE.Mesh(new THREE.SphereGeometry(2,16,16),new THREE.MeshBasicMaterial({color:0xffd23f}));sc.add(sunM);
 world=new THREE.Group();sc.add(world);
 const el=ren.domElement,pt=new Map();let pd=0;
 el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);pt.set(e.pointerId,[e.clientX,e.clientY]);pd=0});
 el.addEventListener('pointerup',e=>pt.delete(e.pointerId));el.addEventListener('pointercancel',e=>pt.delete(e.pointerId));
 el.addEventListener('pointermove',e=>{if(!pt.has(e.pointerId))return;const o=pt.get(e.pointerId);
  if(pt.size==1){cm.a-=(e.clientX-o[0])*.008;cm.e=cl(cm.e+(e.clientY-o[1])*.006,.05,1.5)}
  else{const q=[...pt.entries()].find(x=>x[0]!=e.pointerId)[1],d0=Math.hypot(o[0]-q[0],o[1]-q[1]),d1=Math.hypot(e.clientX-q[0],e.clientY-q[1]);cm.r=cl(cm.r*d0/(d1||1),8,120)}
  pt.set(e.pointerId,[e.clientX,e.clientY])});
 el.addEventListener('wheel',e=>{e.preventDefault();cm.r=cl(cm.r*(1+e.deltaY*.001),8,120)},{passive:false});
 new ResizeObserver(rs).observe($('view'));rs();
}
function rs(){const v=$('view'),w=v.clientWidth,h=v.clientHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
function buildSite(){
 while(world.children.length)world.remove(world.children[0]);obs=[];const S=ST[G.site];
 const g=mesh(new THREE.PlaneGeometry(200,200),S.ground,false);g.rotation.x=-Math.PI/2;world.add(g);
 const [cx,cz,w,h,d]=S.b,bd=mesh(new THREE.BoxGeometry(w,h,d),'#d8d2c4');bd.position.set(cx,h/2,cz);world.add(bd);obs.push(bd);
 S.ob.forEach(o=>{if(o[0]=='t'){const[,x,z,H]=o,tr=mesh(new THREE.CylinderGeometry(.25,.3,H*.45),'#6b4a2b'),cn=mesh(new THREE.SphereGeometry(H*.32,12,10),'#2e7d32');tr.position.set(x,H*.22,z);cn.position.set(x,H*.68,z);world.add(tr,cn);obs.push(tr,cn)}
  else{const[,x,z,bw,bh,bdp]=o,b=mesh(new THREE.BoxGeometry(bw,bh,bdp),'#b9b2a3');b.position.set(x,bh/2,z);world.add(b);obs.push(b)}});
 arr=new THREE.Group();arr.position.set(0,S.m.y,0);world.add(arr);pth=new THREE.Group();world.add(pth);
 cm.r=S.r;buildPanels();buildPath();
}
function buildPanels(){
 while(arr.children.length)arr.remove(arr.children[0]);panels=[];
 const c=G.cfg,P=PN[c.panel],{cols,pitch}=layout(c.tilt),ur=Math.ceil(c.n/cols);
 for(let i=0;i<c.n;i++){const r=Math.floor(i/cols),k=i%cols,m=mesh(new THREE.BoxGeometry(1,.05,1.7),P.c);m.material.metalness=.5;m.material.roughness=.35;
  m.position.set((k-(Math.min(cols,c.n)-1)/2)*1.05,.3+.85*Math.sin(c.tilt*D),(r-(ur-1)/2)*pitch);m.rotation.x=c.tilt*D;arr.add(m);panels.push(m)}
 arr.rotation.y=(180-c.az)*D;
}
function buildPath(){
 while(pth.children.length)pth.remove(pth.children[0]);if(!G.v.path)return;const S=ST[G.site];
 [[23.4,0xf59e0b],[0,0x22c55e],[-23.4,0x3b82f6]].forEach(([dec,col])=>{const pts=[];for(let t=4;t<=20;t+=.25){const sp=sunPos(S.lat,dec,t);if(sp.el>0)pts.push(sdir(sp).multiplyScalar(55).add(new THREE.Vector3(0,S.m.y,0)))}
  pth.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:col})))});
}
function shadeMap(sd){
 world.updateMatrixWorld(true);const out=[],tmp=new THREE.Vector3(),n=new THREE.Vector3(),tg=obs.concat(panels);
 panels.forEach(p=>{p.getWorldPosition(tmp);n.set(0,1,0).applyQuaternion(p.getWorldQuaternion(QQ));ray.set(tmp.clone().addScaledVector(n,.08),sd);ray.far=90;out.push(ray.intersectObjects(tg,false).length>0)});
 return out;
}
function shadeHours(dec){
 const S=ST[G.site],o=new THREE.Vector3(0,S.m.y+.6,0),res=[];world.updateMatrixWorld(true);
 for(let t=7;t<=17;t++){const sp=sunPos(S.lat,dec,t);if(sp.el<8)continue;ray.set(o,sdir(sp));ray.far=90;if(ray.intersectObjects(obs,false).length)res.push(t)}
 return res;
}
function setSun(t,dec){
 const S=ST[G.site],sp=sunPos(S.lat,dec,t),sd=sdir(sp),day=sp.el>1.5;
 sunL.position.copy(sd.clone().multiplyScalar(80));sunL.intensity=day?.4+Math.min(.6,sp.el/40):.05;sunM.position.copy(sd.clone().multiplyScalar(85));sunM.visible=day;
 sc.background=new THREE.Color(day?0x9fc9ee:0x101a2c);
}
function camUpd(){const S=ST[G.site],t=new THREE.Vector3(0,S.m.y/2+1,0);cam.position.set(t.x+cm.r*Math.cos(cm.e)*Math.sin(cm.a),t.y+cm.r*Math.sin(cm.e),t.z+cm.r*Math.cos(cm.e)*Math.cos(cm.a));cam.lookAt(t)}

/* ---------- simulation ---------- */
function startSim(){
 const S=ST[G.site],c=G.cfg,pool=S.soil>.03?['dust','dust','heat','storm','cloud']:['cloud','heat','dust','storm','clear'],r=()=>pool[Math.floor(Math.random()*pool.length)];
 const I=IVS[c.inv],bt=BTS[c.bt],hyb=I.t=='h'&&c.bq>0&&c.bt,pick=['cable','inverter'].concat(c.items.fuse?['fuse']:[]);
 G.sim={day:0,t:0,rate:.7,speed:1,soil:0,dead:0,ev:['clear',r(),r()],d:design(),cap:hyb?c.bq*bt.cap*bt.dod:0,tot:{pv:0,load:0,srv:0,imp:0,exp:0,un:0,shd:0,hrs:0},rep:0,wrong:0,fixed:0,run:1,done:0,hist:[],lastH:0,shT:-9,sh:[],fault:null,fAt:10+Math.random()*3,fType:pick[Math.floor(Math.random()*pick.length)],read:'',pv:0,ld:0,msg:'Day 1 begins.'};
 G.sim.soc=G.sim.cap*.5;nextDay();
}
function nextDay(){
 const M=G.sim;M.day++;if(M.day>3){finish();return}
 const S=ST[G.site],e=EV[M.ev[M.day-1]];M.ctx={...e[1]};M.t=0;M.hist=[];M.lastH=0;M.shT=-9;
 M.soil=cl(M.soil+(S.soil+e[1].soil)*(G.cfg.items.clean?.1:1),0,.5);M.msg=`Day ${M.day}: ${e[0]}${e[1].soil?' — dust is coating the panels':''}`;
}
function pvKw(t){
 const M=G.sim,S=ST[G.site],c=G.cfg,P=PN[c.panel],I=IVS[c.inv],ctx=M.ctx,sp=sunPos(S.lat,S.dec,t);
 if(sp.el<1.5)return 0;
 const se=Math.sin(sp.el*D),dniC=1353*Math.pow(.7,Math.pow(1/se,.678)),dni=dniC*ctx.cloud,sd=sdir(sp);
 if(M.shT<0||t-M.shT>=.25||t<M.shT){M.sh=shadeMap(sd);M.shT=t}
 const b=c.tilt*D,g=c.az*D,cs=Math.max(0,Math.sin(g)*Math.sin(b)*sd.x+Math.cos(b)*sd.y-Math.cos(g)*Math.sin(b)*sd.z);
 const dif=(.1+.3*(1-ctx.cloud))*dniC*(1+Math.cos(b))/2*.9,ta=S.ta+ctx.dT+5*Math.sin(Math.PI*(t-9)/12),sf=1-M.soil;
 const p=M.sh.map(sh=>{const poa=dif+(sh?0:dni*cs),tc=ta+poa/800*25;return{w:P.P*poa/1000*(1+P.g*(tc-25))*sf*.97,tc,sh}});
 M.shFrac=p.filter(x=>x.sh).length/p.length;M.poa=dif+dni*cs;M.tc=p[0].tc;
 let dc=0;
 if(I.t=='m')p.forEach(x=>dc+=x.w);
 else{const s=c.S;for(let i=0;i<p.length;i+=s){const gp=p.slice(i,i+s);let sum=0,mn=1e9,mx=0,ns=0;gp.forEach(x=>{sum+=x.w;mn=Math.min(mn,x.w);mx=Math.max(mx,x.w);if(x.sh)ns++});dc+=ns?Math.max(mn*gp.length,(gp.length-ns)*mx*.55):sum}
  if(p.length%s)dc*=.93;if(s*P.Vmp*(1-.0035*(p[0].tc-25))<I.vmin)dc=0}
 let ac=dc*I.e/1000;ac=I.t=='m'?Math.min(ac,c.n*.4):Math.min(ac,I.kw);
 return M.d.st=='over'?0:ac;
}
function sub(dh){
 const M=G.sim,S=ST[G.site],c=G.cfg,I=IVS[c.inv],bt=BTS[c.bt];M.t+=dh;
 if(M.t>=24){nextDay();return}
 if(M.day==2&&!M.fault&&M.t>=M.fAt){M.fault={type:M.fType,fixed:0};M.msg='⚠ Production stopped! Use the multimeter to find the fault.'}
 if(M.ctx.st&&M.t>=M.ctx.st&&!c.items.spd&&!M.dead&&!M.stormHit){M.dead=1;M.stormHit=1;M.msg='⚡ Lightning surge destroyed the inverter. No surge protector!'}
 const faulty=M.fault&&!M.fault.fixed,pv=(faulty||M.dead)?0:pvKw(M.t);
 const base=PROF[S.pr],sum=base.reduce((a,b)=>a+b,0),ld=base[Math.floor(M.t)]/sum*S.dem;
 let direct=Math.min(pv,ld),sur=pv-direct,def=ld-direct,srv=direct,imp=0,exp=0,un=0;
 if(M.cap){const st=Math.min(sur*dh*bt.e,M.cap-M.soc);M.soc+=st;sur-=st/bt.e/dh;const tk=Math.min(def*dh,M.soc*bt.e);M.soc-=tk/bt.e;srv+=tk/dh;def-=tk/dh}
 const out=S.out&&M.day==2&&M.t>=S.out[0]&&M.t<S.out[1];
 if(S.grid&&!out){imp=def;exp=sur}else un=def;
 const T=M.tot;T.pv+=pv*dh;T.load+=ld*dh;T.srv+=srv*dh;T.imp+=imp*dh;T.exp+=exp*dh;T.un+=un*dh;
 if(pv>0){T.shd+=(M.shFrac||0)*dh;T.hrs+=dh}
 M.pv=pv;M.ld=ld;M.out=out;
 if(M.t-M.lastH>=.25){M.lastH=M.t;M.hist.push({t:M.t,pv,ld,soc:M.cap?M.soc/M.cap:0})}
}
function tick(dt){const M=G.sim;if(!M||!M.run||M.done)return;let h=dt*M.rate*M.speed;while(h>0&&!M.done){const d=Math.min(h,.1);sub(d);h-=d}}
function finish(){
 const M=G.sim,S=ST[G.site],T=M.tot,c=G.cfg;M.done=1;M.run=0;
 const cov=T.load?T.srv/T.load:0,have=S.req.filter(k=>c.items[k]).length,saf=S.req.length?have/S.req.length:1,okB=G.mode=='sandbox'||cost()<=S.bud;
 const score=.5*cov+.2*saf+.2*(okB?1:0)+.1*(M.wrong<=1?1:0),stars=score>=.85?3:score>=.65?2:score>=.4?1:0;
 const pay=Math.round(S.pay*(.35+.65*cov)*(.5+.5*saf))-M.rep;
 M.rep2={cov,saf,score,stars,pay,okB};
 if(G.mode=='career'){G.bank+=Math.max(0,pay);G.stars[G.site]=Math.max(G.stars[G.site]||0,stars)}
}

/* ---------- UI ---------- */
const btn=(k,l,on)=>`<button data-set="${k}" aria-pressed="${!!on}">${l}</button>`;
function head(){const S=ST[G.site],co=cost();$('hC').textContent=`${S.em} ${S.n} · ${{career:'Career',sandbox:'Sandbox',edu:'Educational'}[G.mode]}`;
 $('hB').innerHTML=G.mode=='sandbox'?`$${co} (unlimited)`:`<span style="color:${co>S.bud?'#fca5a5':'#bbf7d0'}">$${co} / $${S.bud}</span>`+(G.mode=='career'?` · bank $${G.bank}`:'')}
function nav(){$('nv').innerHTML=['1 Survey','2 Shop','3 Install','4 Run'].map((l,i)=>`<button data-ph="${i}" class="${G.ph==i?'on':''}">${l}</button>`).join('')}
function msgs(d){return d.m.map(x=>`<div class="${x[0]}">${x[0]=='ok'?'✔':x[0]=='bad'?'✖':'▲'} ${x[1]}</div>`).join('')}
function edu(){
 if(G.mode!='edu')return '';const c=G.cfg,P=PN[c.panel],d=design(),v=d.s*P.Vmp;
 return `<div class="edu"><b>Lesson: series vs parallel</b><br>Series adds voltage: ${d.s} × ${P.Vmp} V = <b>${Math.round(v)} V</b>. Parallel adds current: ${d.par} string(s) × ${P.Isc} A = <b>${d.I.toFixed(1)} A</b>.<br>Power P = V × I ≈ ${Math.round(v*P.Isc*.9*d.par)} W peak. By Ohm's law I = V / R, so thin long cables lose power as heat.<br>A shaded panel in a series string limits the current of the whole string. Microinverters avoid this.</div>`}
function go(p){
 G.ph=p;if(p!=3)G.sim=null;pth&&buildPath();if(p==3)buildPanels();
 const f=[pSurvey,pShop,pInstall,pRun][p];$('pn').innerHTML=f();nav();head();
 if(p==0)updShade();cm.e=p==0?cm.e:cm.e;
}
function pSurvey(){
 const S=ST[G.site];
 return `<div class="k">${S.info}</div><div class="k"><b>Mount area</b> ${S.m.w} × ${S.m.d} m · up to ${layout(G.cfg.tilt).cap} panels at ${G.cfg.tilt}° tilt<br><b>Latitude</b> ${S.lat}° · <b>Load</b> ${S.dem} kWh/day · <b>${S.grid?'Grid-tied':'Off-grid'}</b><br><b>Required safety:</b> ${S.req.map(k=>ITM[k][0]).join(', ')}</div>
 <div class="row">${btn('dec:23.4','Summer sun',G.v.dec>0)}${btn('dec:-23.4','Winter sun',G.v.dec<0)}${btn('dec:0','Equinox',G.v.dec==0)}</div>
 <div class="row" style="margin-top:6px">${btn('path:1','Sun path finder',G.v.path)}<button data-top="1">Drone: top view</button></div>
 <label>Time of day: <b id="tv">${G.v.t}</b> h<input type="range" id="tm" min="5" max="19" step=".25" value="${G.v.t}"></label>
 <div class="k" id="shd"></div><button class="go" data-ph="1">Continue to shop →</button>`}
function updShade(){const h=shadeHours(G.v.dec);$('shd').innerHTML=h.length?`<b class="warn">Shade at the mount centre:</b> ${h.map(x=>x+':00').join(', ')}. Consider microinverters or fewer panels in shaded rows.`:'<b class="ok">No shading at the mount centre for this sun path.</b>'}
function pShop(){
 const c=G.cfg;
 return `<h3>Solar panels</h3><div class="row">${PN.map((p,i)=>btn('panel:'+i,`${p.n}<small>$${p.pr} · ${p.g*100}%/°C</small>`,c.panel==i)).join('')}</div>
 <h3>Inverter</h3><div class="row">${IVS.map((p,i)=>btn('inv:'+i,`${p.n}<small>$${p.pr}${p.t=='m'?' each':''}</small>`,c.inv==i)).join('')}</div>
 <h3>Batteries</h3><div class="row">${BTS.map((p,i)=>btn('bt:'+i,`${p.n}<small>${p.pr?'$'+p.pr+' each':''}</small>`,c.bt==i)).join('')}</div>
 <div class="row" style="margin-top:6px"><button data-inc="bq:-1">−</button><button disabled style="flex:2">${c.bq} battery unit(s)</button><button data-inc="bq:1">+</button></div>
 <h3>Safety and upkeep</h3><div class="row">${Object.keys(ITM).map(k=>btn('item:'+k,`${ITM[k][0]}<small>$${ITM[k][1]}</small>`,c.items[k])).join('')}</div>
 <div class="k" id="cs"></div>${edu()}<button class="go" data-ph="2">Continue to install →</button>`}
function pInstall(){
 const c=G.cfg,L=layout(c.tilt);c.n=Math.min(c.n,L.cap);
 return `<label>Panels: <b id="v_n">${c.n}</b> (max ${L.cap})<input type="range" data-r="n" min="1" max="${L.cap}" value="${c.n}"></label>
 <label>Tilt: <b id="v_tilt">${c.tilt}</b>°<input type="range" data-r="tilt" min="0" max="60" value="${c.tilt}"></label>
 <label>Azimuth: <b id="v_az">${c.az}</b>° (180 = south)<input type="range" data-r="az" min="90" max="270" value="${c.az}"></label>
 <label>Panels per string (series): <b id="v_S">${c.S}</b><input type="range" data-r="S" min="1" max="20" value="${c.S}"></label>
 <div class="k" id="dz"></div>${edu()}<button class="go" data-ph="3">Continue to run →</button>`}
function updInstall(){const d=design(),c=G.cfg;$('dz').innerHTML=`<b>Wiring:</b> ${d.str} string(s) of ${d.s}, ${(d.Pdc/1000).toFixed(1)} kWp<br>${msgs(d)}`}
function pRun(){
 const M=G.sim;
 if(!M)return `<div class="k">Check your design, then test it for 3 days. You will face weather and a possible equipment fault.</div><div class="k" id="dz"></div><button class="go" data-start="1">▶ Run 3-day test</button>`+edu();
 if(M.done)return report();
 return `<div class="stat"><div><b id="r_day">1</b><small>Day / 3</small></div><div><b id="r_pv">0</b><small>PV kW</small></div><div><b id="r_ld">0</b><small>Load kW</small></div><div><b id="r_e">0</b><small>PV kWh</small></div><div><b id="r_soc">—</b><small>Battery %</small></div><div><b id="r_cov">0</b><small>Covered %</small></div></div>
 <div class="k" id="r_msg"></div><canvas id="ch" width="360" height="150"></canvas>
 <div class="row" style="margin-top:6px">${[1,3,8].map(s=>`<button data-spd="${s}" aria-pressed="${M.speed==s}">${s}×</button>`).join('')}<button data-clean="1">Clean panels ($40)</button></div><div id="flt"></div>${edu()}`}
function fltUI(){
 const M=G.sim,f=M.fault,el=$('flt');if(!el)return;let h='';
 if(M.dead)h=`<div class="k bad"><b>Inverter destroyed.</b> <button data-fix="dead">Replace inverter ($${IVS[G.cfg.inv].pr})</button></div>`;
 if(f&&!f.fixed){const vm=Math.round(M.d.Vmp);
  h+=`<div class="k"><b class="bad">Fault!</b> Probe the test points with the multimeter:<div class="row">${[['A','Panel terminals'],['B','After cable'],['C','After fuse'],['D','Inverter AC output']].map(x=>`<button data-tp="${x[0]}">${x[0]}: ${x[1]}</button>`).join('')}</div><div id="rd" style="margin:6px 0"><b>${M.read||'Tap a test point.'}</b></div><div class="row"><button data-fix="cable">Replace cable ($60)</button>${G.cfg.items.fuse?'<button data-fix="fuse">Replace fuse ($25)</button>':''}<button data-fix="inverter">Replace inverter ($${IVS[G.cfg.inv].pr})</button></div></div>`}
 if(el.dataset.h!==h){el.innerHTML=h;el.dataset.h=h}
}
function report(){
 const M=G.sim,R=M.rep2,T=M.tot,S=ST[G.site],tips=[];
 if(T.hrs&&T.shd/T.hrs>.1)tips.push('Shading cost you energy: move panels away from the shadows, or try microinverters.');
 if(R.cov<.6)tips.push('Low coverage: add panels, or batteries to shift solar energy into the evening.');
 if(M.d.st!='ok')tips.push('Your string voltage was outside the inverter window.');
 if(R.saf<1)tips.push('Missing required safety items lowered your payment.');
 if(!R.okB)tips.push('You went over the client budget.');
 if(M.wrong)tips.push('You replaced '+M.wrong+' healthy part(s) while troubleshooting. Measure first!');
 return `<div class="k"><h3 style="margin:0">Result: ${'★'.repeat(R.stars)}${'☆'.repeat(3-R.stars)}</h3>
 Solar produced <b>${T.pv.toFixed(1)} kWh</b> · load <b>${T.load.toFixed(1)} kWh</b><br>Covered by solar/battery: <b>${Math.round(R.cov*100)}%</b> · imported ${T.imp.toFixed(1)} · exported ${T.exp.toFixed(1)} · unmet ${T.un.toFixed(1)} kWh<br>Safety: ${Math.round(R.saf*100)}% · repairs $${M.rep}<br><b>Payment: $${Math.max(0,R.pay)}</b></div>
 ${tips.map(t=>`<div class="k warn">▲ ${t}</div>`).join('')}<button class="go" data-ph="1">Improve my design</button><button class="go" style="background:#fff" data-menu="1">Choose another client</button>`}
function uiRun(){
 const M=G.sim;if(!M||M.done)return;
 const T=M.tot,set=(i,v)=>{const e=$(i);if(e)e.textContent=v};
 set('r_day',M.day);set('r_pv',M.pv.toFixed(1));set('r_ld',M.ld.toFixed(1));set('r_e',T.pv.toFixed(0));set('r_soc',M.cap?Math.round(M.soc/M.cap*100):'—');set('r_cov',T.load?Math.round(T.srv/T.load*100):0);
 const hh=Math.floor(M.t);set('r_msg',`${String(hh).padStart(2,'0')}:${String(Math.floor((M.t-hh)*60)).padStart(2,'0')} · ${M.msg}${M.out?' · GRID OUTAGE':''}${M.shFrac>.05&&M.pv>0?' · '+Math.round(M.shFrac*100)+'% of panels shaded':''}`);
 fltUI();chart();
}
function chart(){
 const cv=$('ch'),M=G.sim;if(!cv)return;const x=cv.getContext('2d'),W=cv.width,H=cv.height,mx=Math.max(2,...M.hist.map(h=>Math.max(h.pv,h.ld)))*1.15,X=t=>t/24*(W-10)+5,Y=v=>H-16-v/mx*(H-26);
 x.clearRect(0,0,W,H);x.fillStyle='#64748b';x.font='10px sans-serif';x.strokeStyle='#e2e8f0';
 for(let h=0;h<=24;h+=6){x.beginPath();x.moveTo(X(h),4);x.lineTo(X(h),H-16);x.stroke();x.fillText(h+'h',X(h)-6,H-4)}
 if(M.hist.length<2)return;
 x.beginPath();x.moveTo(X(M.hist[0].t),Y(0));M.hist.forEach(h=>x.lineTo(X(h.t),Y(h.pv)));x.lineTo(X(M.hist.at(-1).t),Y(0));x.fillStyle='#fbbf2480';x.fill();
 x.strokeStyle='#2563eb';x.lineWidth=2;x.beginPath();M.hist.forEach((h,i)=>i?x.lineTo(X(h.t),Y(h.ld)):x.moveTo(X(h.t),Y(h.ld)));x.stroke();
 if(M.cap){x.strokeStyle='#16a34a';x.lineWidth=1.5;x.beginPath();M.hist.forEach((h,i)=>{const y=H-16-h.soc*(H-26);i?x.lineTo(X(h.t),y):x.moveTo(X(h.t),y)});x.stroke()}
 x.fillStyle='#334155';x.fillText('amber: solar kW · blue: load kW · green: battery',8,12);
}
function menu(){
 const m=$('menu');m.style.display='flex';
 m.innerHTML=`<div class="card"><h1>SolarCraft 3D</h1><p>Energy Architect</p><h3>Mode</h3><div class="row">${[['career','Career'],['sandbox','Sandbox'],['edu','Educational']].map(([k,l])=>`<button data-mode="${k}" aria-pressed="${G.mode==k}">${l}</button>`).join('')}</div><h3>Choose a client</h3>${ST.map((s,i)=>{const lock=G.mode=='career'&&i>0&&!(G.stars[i-1]>0);return `<button class="cl" data-site="${i}" ${lock?'disabled':''}>${s.em} ${s.n}<small>${s.dem} kWh/day · ${s.grid?'grid-tied':'off-grid'} · budget $${s.bud}${G.stars[i]?' · '+'★'.repeat(G.stars[i]):''}${lock?' · finish the previous client first':''}</small></button>`}).join('')}</div>`;
}
function pickSite(i){
 G.site=i;const L=layout(25);G.cfg={panel:0,n:Math.min(8,L.cap),S:4,inv:0,bt:1,bq:0,tilt:25,az:180,items:{fuse:0,breaker:0,spd:0,ground:0,clean:0}};
 G.v={t:12,dec:ST[i].dec,path:false};G.sim=null;buildSite();$('menu').style.display='none';go(0);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;const d=t.dataset,c=G.cfg;
 if(t.id=='bM'){menu();return}
 if(d.mode){G.mode=d.mode;menu();return}
 if(d.site!==undefined){pickSite(+d.site);return}
 if(d.menu){menu();return}
 if(d.ph!==undefined){go(+d.ph);return}
 if(d.top){cm.e=1.45;return}
 if(d.start){startSim();if(G.mode!='sandbox'&&cost()>ST[G.site].bud&&G.mode=='career'){G.sim=null;$('pn').insertAdjacentHTML('afterbegin','<div class="k bad">Over budget! Reduce your purchases in the shop.</div>');return}go(3);return}
 if(d.spd){G.sim.speed=+d.spd;go(3);return}
 if(d.clean){const M=G.sim;if(M.soil>0){M.soil=0;M.rep+=40;M.msg='Panels cleaned.'}return}
 if(d.tp){const M=G.sim,f=M.fault,v=Math.round(M.d.Vmp),bad=f.type,z=(tp)=>tp=='A'?v:tp=='B'?(bad=='cable'?0:v):tp=='C'?(bad=='cable'||bad=='fuse'?0:v):0;M.read=`${d.tp}: ${z(d.tp)} ${d.tp=='D'?'V AC':'V DC'}`;fltUI();return}
 if(d.fix){const M=G.sim,f=M.fault,pr={cable:60,fuse:25,inverter:IVS[c.inv].pr,dead:IVS[c.inv].pr}[d.fix];M.rep+=pr;
  if(d.fix=='dead'){M.dead=0;M.msg='Inverter replaced.'}
  else if(f&&f.type==d.fix){f.fixed=1;M.read='';M.msg='✔ Fault fixed. Production resumes.'}
  else{M.wrong++;M.msg='That part was fine. Money wasted.'}return}
 if(d.set){const[k,v]=d.set.split(':');
  if(k=='dec'){G.v.dec=+v;buildPath();go(0)}else if(k=='path'){G.v.path=!G.v.path;buildPath();go(0)}
  else if(k=='item'){c.items[v]=c.items[v]?0:1;go(1)}else{c[k]=+v;if(k=='bt'&&!c.bq)c.bq=+v?1:0;if(k=='bt'&&!+v)c.bq=0;if(k=='panel')buildPanels();go(1)}return}
 if(d.inc){const[k,v]=d.inc.split(':');c[k]=cl(c[k]+ +v,0,8);if(c[k]>0&&!c.bt)c.bt=1;go(1);return}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id=='tm'){G.v.t=+t.value;$('tv').textContent=t.value;return}
 if(t.dataset.r){const k=t.dataset.r;G.cfg[k]=+t.value;$('v_'+k).textContent=t.value;
  if(k=='tilt'){const L=layout(G.cfg.tilt);if(G.cfg.n>L.cap){G.cfg.n=L.cap;go(2);return}}
  buildPanels();updInstall();head()}
});
function upd(){if(G.ph==2)updInstall();if(G.ph==1){const d=design(),S=ST[G.site],el=$('cs');if(el)el.innerHTML=`<b>Total: $${cost()}</b> of $${S.bud}<br>${msgs(d)}`}if(G.ph==3&&!G.sim){const el=$('dz');if(el)el.innerHTML=msgs(design())}}
let last=performance.now(),fc=0;
function loop(now){
 const dt=Math.min(.1,(now-last)/1000);last=now;tick(dt);
 const S=ST[G.site],M=G.sim;setSun(M?M.t:G.v.t,M?S.dec:G.v.dec);camUpd();ren.render(sc,cam);
 if(++fc%8==0){if(G.ph==3)uiRun();upd();head();if(G.ph==3&&G.sim&&G.sim.done&&$('ch')){go(3)}}
 requestAnimationFrame(loop);
}
initGL();menu();pickSiteInit();
function pickSiteInit(){G.site=0;G.cfg={panel:0,n:8,S:4,inv:0,bt:1,bq:0,tilt:25,az:180,items:{fuse:0,breaker:0,spd:0,ground:0,clean:0}};G.v={t:12,dec:0,path:false};buildSite();go(0);$('menu').style.display='flex'}
requestAnimationFrame(loop);
</script>
</body>
</html>
